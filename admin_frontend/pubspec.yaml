name: admin_frontend
description: "Admin Dashboard for Auto Garage System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  
  # HTTP
  http: ^1.2.2
  web_socket_channel: ^2.4.0
  
  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.2.3
  
  # Internationalization
  intl: ^0.20.2

  # QR Code
  qr_flutter: ^4.1.0

  # Printing / PDF
  printing: ^5.12.0

  # File Picker
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
