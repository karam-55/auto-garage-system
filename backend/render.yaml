services:
  - type: web
    name: auto-garage-backend
    env: dart
    buildCommand: dart pub get
    startCommand: dart run bin/server.dart
    envVars:
      - key: DATABASE_URL
        value: postgresql://garage_user:xOqMzT1nTPbHlTWLkpfgRC3Q8bMuoAf8@dpg-d824opgjs32c73dm9fs0-a/auto_garage_9ebq
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://auto-garage-staff-frontend.pages.dev
        # CORS origin for admin/staff frontend
      - key: CUSTOMER_CORS_ORIGIN
        value: https://auto-garage-customer-frontend.pages.dev
        # CORS origin for customer frontend
      - key: MECHANIC_CORS_ORIGIN
        value: *
        # CORS origin for mechanic app (wildcard allows all origins)
      - key: JWT_REFRESH_SECRET
        value: change_this_to_secure_random_string
        # Secret key for JWT refresh token generation
      - key: SKIP_SCHEMA_EXECUTION
        value: true
        # Skip database schema execution on startup (useful for managed databases)
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_RECEPTIONIST_PASSWORD
        sync: false
    plan: free
    healthCheckPath: /health
