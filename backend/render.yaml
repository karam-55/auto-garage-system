services:
  - type: web
    name: auto-garage-backend
    env: dart
    buildCommand: dart pub get
    startCommand: dart run bin/server.dart
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
    plan: free
    healthCheckPath: /health
