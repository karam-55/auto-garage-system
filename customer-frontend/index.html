<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Go - تتبع السيارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="container mx-auto px-4 py-8">
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center min-h-[60vh]">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600"></div>
            <p class="mt-4 text-gray-600">جاري تحميل البيانات...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden max-w-md mx-auto bg-red-50 border border-red-200 rounded-lg p-6">
            <div class="flex items-center">
                <svg class="w-8 h-8 text-red-600 ml-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                <div>
                    <h3 class="text-lg font-semibold text-red-800">خطأ</h3>
                    <p id="errorMessage" class="text-red-600 mt-1"></p>
                </div>
            </div>
        </div>

        <!-- Car Details -->
        <div id="carDetails" class="hidden max-w-4xl mx-auto">
            <!-- Vehicle Info -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h1 class="text-2xl font-bold text-gray-800">بيانات السيارة</h1>
                    <span id="statusBadge" class="px-3 py-1 rounded-full text-sm font-semibold"></span>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <p class="text-gray-600 text-sm">الماركة والموديل</p>
                        <p id="vehicleName" class="text-lg font-semibold"></p>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">رقم اللوحة</p>
                        <p id="licensePlate" class="text-lg font-semibold"></p>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">السنة</p>
                        <p id="vehicleYear" class="text-lg font-semibold"></p>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">اسم العميل</p>
                        <p id="customerName" class="text-lg font-semibold"></p>
                    </div>
                </div>
            </div>

            <!-- Services -->
            <div id="servicesSection" class="hidden bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">الخدمات المطلوبة</h2>
                <div id="servicesList" class="space-y-3"></div>
                <div class="mt-4 pt-4 border-t">
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-semibold">الإجمالي</span>
                        <span id="totalPrice" class="text-2xl font-bold text-blue-600"></span>
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div id="notesSection" class="hidden bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">ملاحظات</h2>
                <p id="bookingNotes" class="text-gray-700"></p>
            </div>

            <!-- Estimated Completion -->
            <div id="completionDateSection" class="hidden bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">تاريخ التسليم المقدر</h2>
                <p id="completionDate" class="text-lg text-gray-700"></p>
            </div>

            <!-- Auto Refresh Notice -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">
                <p class="text-blue-800 text-sm">
                    🔄 يتم تحديث البيانات تلقائياً كل 10 ثواني
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://auto-garage-system-backend.onrender.com';

        // Get publicCarId from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const publicCarId = urlParams.get('car');

        console.log('DEBUG: publicCarId:', publicCarId);
        console.log('DEBUG: API_BASE_URL:', API_BASE_URL);

        if (!publicCarId) {
            showError('معرف السيارة مفقود. يرجى مسح QR code صحيح.');
        } else {
            loadCarData();
        }

        async function loadCarData() {
            console.log('DEBUG: loadCarData called');
            try {
                const response = await fetch(`${API_BASE_URL}/public/car/${publicCarId}`);
                console.log('DEBUG: Response status:', response.status);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        showError('السيارة غير موجودة');
                    } else {
                        throw new Error('فشل في تحميل البيانات');
                    }
                    return;
                }

                const data = await response.json();
                console.log('DEBUG: Response data:', data);
                displayCarData(data);
            } catch (error) {
                console.error('Error loading car data:', error);
                showError('فشل في الاتصال بالخادم');
            }
        }

        function displayCarData(data) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('carDetails').classList.remove('hidden');

            // Vehicle Info
            document.getElementById('vehicleName').textContent = 
                `${data.vehicle.make} ${data.vehicle.model}`;
            document.getElementById('licensePlate').textContent = 
                data.vehicle.licensePlate || 'غير متوفر';
            document.getElementById('vehicleYear').textContent = data.vehicle.year;
            document.getElementById('customerName').textContent = data.customer.fullName;

            // Status
            if (data.booking) {
                const statusBadge = document.getElementById('statusBadge');
                const status = data.booking.status;
                
                const statusColors = {
                    'PENDING': 'bg-yellow-100 text-yellow-800',
                    'IN_PROGRESS': 'bg-blue-100 text-blue-800',
                    'WAITING_PARTS': 'bg-orange-100 text-orange-800',
                    'READY': 'bg-green-100 text-green-800',
                    'DELIVERED': 'bg-gray-100 text-gray-800',
                    'CANCELLED': 'bg-red-100 text-red-800'
                };

                const statusTexts = {
                    'PENDING': 'قيد الانتظار',
                    'IN_PROGRESS': 'جاري العمل',
                    'WAITING_PARTS': 'بانتظار القطع',
                    'READY': 'جاهز',
                    'DELIVERED': 'تم التسليم',
                    'CANCELLED': 'ملغي'
                };

                statusBadge.className = `px-3 py-1 rounded-full text-sm font-semibold ${statusColors[status] || 'bg-gray-100 text-gray-800'}`;
                statusBadge.textContent = statusTexts[status] || status;

                // Services
                if (data.services && data.services.length > 0) {
                    document.getElementById('servicesSection').classList.remove('hidden');
                    const servicesList = document.getElementById('servicesList');
                    servicesList.innerHTML = '';
                    
                    let total = 0;
                    data.services.forEach(service => {
                        const price = parseFloat(service.priceSYP);
                        total += price;
                        
                        servicesList.innerHTML += `
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                <div>
                                    <p class="font-semibold">${service.serviceName}</p>
                                    ${service.serviceDescription ? `<p class="text-sm text-gray-600">${service.serviceDescription}</p>` : ''}
                                    ${service.notes ? `<p class="text-sm text-gray-500 mt-1">ملاحظات: ${service.notes}</p>` : ''}
                                </div>
                                <span class="font-semibold text-blue-600">${price.toLocaleString()} ل.س</span>
                            </div>
                        `;
                    });
                    
                    document.getElementById('totalPrice').textContent = `${total.toLocaleString()} ل.س`;
                }

                // Notes
                if (data.booking.notes) {
                    document.getElementById('notesSection').classList.remove('hidden');
                    document.getElementById('bookingNotes').textContent = data.booking.notes;
                }

                // Completion Date
                if (data.booking.estimatedCompletionDate) {
                    document.getElementById('completionDateSection').classList.remove('hidden');
                    const date = new Date(data.booking.estimatedCompletionDate);
                    document.getElementById('completionDate').textContent = date.toLocaleDateString('ar-EG', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            } else {
                const statusBadge = document.getElementById('statusBadge');
                statusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-gray-100 text-gray-800';
                statusBadge.textContent = 'لا يوجد حجز نشط';
            }
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('carDetails').classList.add('hidden');
            document.getElementById('errorMessage').textContent = message;
        }
    </script>
</body>
</html>
