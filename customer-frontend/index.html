<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Garage Go - تتبع السيارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .card-shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div id="app" class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8 fade-in">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl shadow-lg mb-4 overflow-hidden">
                <img id="companyLogo" src="" alt="شعار الشركة" class="w-12 h-12 object-contain p-2 hidden">
                <svg id="defaultLogo" class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path>
                </svg>
            </div>
            <h1 id="companyName" class="text-3xl font-bold text-gray-800 mb-2">Garage Go</h1>
            <p class="text-gray-600">تتبع حالة سيارتك</p>
        </div>

        <!-- Token Input State -->
        <div id="tokenInput" class="hidden max-w-md mx-auto bg-white rounded-2xl card-shadow-lg p-6 fade-in">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">تتبع الحجز</h2>
                <p class="text-gray-600">أدخل رمز التتبع لعرض حالة حجزك</p>
            </div>
            <div class="space-y-4">
                <input 
                    type="text" 
                    id="trackingToken" 
                    placeholder="أدخل رمز التتبع" 
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none text-center text-lg"
                >
                <button 
                    onclick="searchBooking()" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-3 rounded-xl font-semibold hover:from-blue-700 hover:to-indigo-800 transition-all"
                >
                    بحث
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden flex flex-col items-center justify-center min-h-[60vh] fade-in">
            <div class="relative">
                <div class="animate-spin rounded-full h-16 w-16 border-4 border-blue-600 border-t-transparent"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path>
                    </svg>
                </div>
            </div>
            <p class="mt-6 text-gray-600 font-semibold">جاري تحميل البيانات...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden max-w-md mx-auto bg-red-50 border-2 border-red-200 rounded-2xl p-6 fade-in">
            <div class="flex items-center mb-4">
                <div class="flex-shrink-0">
                    <svg class="w-10 h-10 text-red-600 ml-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-red-800">حدث خطأ</h3>
                    <p id="errorMessage" class="text-red-600 mt-1"></p>
                </div>
            </div>
            <button 
                onclick="retryLoad()" 
                class="w-full bg-red-600 text-white py-3 rounded-xl font-semibold hover:bg-red-700 transition-all"
            >
                إعادة المحاولة
            </button>
        </div>

        <!-- Car Details -->
        <div id="carDetails" class="hidden max-w-4xl mx-auto fade-in">
            <!-- Vehicle Info -->
            <div class="bg-white rounded-2xl card-shadow-lg p-6 mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-xl flex items-center justify-center">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path>
                            </svg>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800">بيانات السيارة</h1>
                    </div>
                    <span id="statusBadge" class="px-4 py-2 rounded-full text-sm font-bold"></span>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl p-4">
                        <div class="flex items-center gap-2 mb-2">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path>
                            </svg>
                            <p class="text-gray-600 text-sm font-medium">الماركة والموديل</p>
                        </div>
                        <p id="vehicleName" class="text-lg font-bold text-gray-800"></p>
                    </div>
                    <div class="bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl p-4">
                        <div class="flex items-center gap-2 mb-2">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            <p class="text-gray-600 text-sm font-medium">رقم اللوحة</p>
                        </div>
                        <p id="licensePlate" class="text-lg font-bold text-gray-800"></p>
                    </div>
                    <div class="bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl p-4">
                        <div class="flex items-center gap-2 mb-2">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            <p class="text-gray-600 text-sm font-medium">السنة</p>
                        </div>
                        <p id="vehicleYear" class="text-lg font-bold text-gray-800"></p>
                    </div>
                    <div class="bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl p-4">
                        <div class="flex items-center gap-2 mb-2">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <p class="text-gray-600 text-sm font-medium">اسم العميل</p>
                        </div>
                        <p id="customerName" class="text-lg font-bold text-gray-800"></p>
                    </div>
                </div>
            </div>

            <!-- Services -->
            <div id="servicesSection" class="hidden bg-white rounded-2xl card-shadow-lg p-6 mb-6">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-emerald-600 rounded-xl flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">الخدمات المطلوبة</h2>
                </div>
                <div id="servicesList" class="space-y-3"></div>
                <div class="mt-6 pt-6 border-t-2 border-gray-100">
                    <div class="flex justify-between items-center bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-4">
                        <span class="text-lg font-bold text-gray-700">الإجمالي</span>
                        <span id="totalPrice" class="text-2xl font-bold text-blue-600"></span>
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div id="notesSection" class="hidden bg-white rounded-2xl card-shadow-lg p-6 mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-gradient-to-br from-yellow-500 to-orange-600 rounded-xl flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">ملاحظات</h2>
                </div>
                <div class="bg-gradient-to-br from-yellow-50 to-orange-50 rounded-xl p-4">
                    <p id="bookingNotes" class="text-gray-700"></p>
                </div>
            </div>

            <!-- Estimated Completion -->
            <div id="completionDateSection" class="hidden bg-white rounded-2xl card-shadow-lg p-6 mb-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-xl flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">تاريخ التسليم المقدر</h2>
                </div>
                <div class="bg-gradient-to-br from-purple-50 to-indigo-50 rounded-xl p-4">
                    <p id="completionDate" class="text-lg font-semibold text-gray-800"></p>
                </div>
            </div>

            <!-- Auto Refresh Notice -->
            <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-4 text-center shadow-lg">
                <div class="flex items-center justify-center gap-2 text-white">
                    <svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <p class="text-sm font-semibold">يتم تحديث البيانات تلقائياً كل 30 ثانية</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://auto-garage-system-backend.onrender.com';
        let pollingInterval = null;
        let currentToken = null;

        // Get publicToken from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const publicToken = urlParams.get('token');

        console.log('DEBUG: publicToken:', publicToken);
        console.log('DEBUG: API_BASE_URL:', API_BASE_URL);

        if (!publicToken) {
            // Show token input form
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('tokenInput').classList.remove('hidden');
        } else {
            if (publicToken.length < 6) {
                showError('الرجاء إدخال رمز التتبع المكون من 6 خانات على الأقل');
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('tokenInput').classList.remove('hidden');
            } else {
                currentToken = publicToken;
                loadBookingData();
            }
        }

        function searchBooking() {
            const tokenInput = document.getElementById('trackingToken').value.trim();
            if (!tokenInput) {
                showError('يرجى إدخال رمز التتبع');
                return;
            }
            currentToken = tokenInput;
            document.getElementById('tokenInput').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            loadBookingData();
        }

        async function loadBookingData() {
            console.log('DEBUG: loadBookingData called');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('carDetails').classList.add('hidden');
            
            try {
                const response = await fetch(`${API_BASE_URL}/public/bookings/${currentToken}`);
                console.log('DEBUG: Response status:', response.status);
                
                if (!response.ok) {
                    stopPolling();
                    if (response.status === 404) {
                        showError('رمز التتبع غير صحيح أو الحجز غير موجود');
                    } else if (response.status === 400) {
                        showError('رمز التتبع غير صالح');
                    } else if (response.status === 500) {
                        showError('حدث خطأ في الخادم، يرجى المحاولة مرة أخرى لاحقاً');
                    } else {
                        showError('فشل في تحميل البيانات، يرجى المحاولة مرة أخرى');
                    }
                    document.getElementById('loading').classList.add('hidden');
                    return;
                }

                const data = await response.json();
                console.log('DEBUG: Response data:', data);
                displayBookingData(data);
                
                // Start polling for updates every 30 seconds
                startPolling();
            } catch (error) {
                console.error('Error loading booking data:', error);
                stopPolling();
                showError('فشل في الاتصال بالخادم، يرجى التحقق من اتصال الإنترنت والمحاولة مرة أخرى');
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function startPolling() {
            // Clear existing interval if any
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }
            
            // Poll every 30 seconds
            pollingInterval = setInterval(() => {
                loadBookingData();
            }, 30000);
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        function displayBookingData(data) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('tokenInput').classList.add('hidden');
            document.getElementById('carDetails').classList.remove('hidden');

            // Vehicle Info
            document.getElementById('vehicleName').textContent = 
                `${data.vehicle.make} ${data.vehicle.model}`;
            document.getElementById('licensePlate').textContent = 
                data.vehicle.licensePlate || 'غير متوفر';
            document.getElementById('vehicleYear').textContent = data.vehicle.year;
            document.getElementById('customerName').textContent = data.customer.fullName;

            // Status
            if (data.booking) {
                const statusBadge = document.getElementById('statusBadge');
                const status = data.booking.status;
                
                const statusColors = {
                    'PENDING': 'bg-yellow-100 text-yellow-800',
                    'IN_PROGRESS': 'bg-blue-100 text-blue-800',
                    'WAITING_PARTS': 'bg-orange-100 text-orange-800',
                    'READY': 'bg-green-100 text-green-800',
                    'DELIVERED': 'bg-gray-100 text-gray-800',
                    'CANCELLED': 'bg-red-100 text-red-800'
                };

                const statusTexts = {
                    'PENDING': 'قيد الانتظار',
                    'IN_PROGRESS': 'جاري العمل',
                    'WAITING_PARTS': 'بانتظار القطع',
                    'READY': 'جاهز',
                    'DELIVERED': 'تم التسليم',
                    'CANCELLED': 'ملغي'
                };

                statusBadge.className = `px-3 py-1 rounded-full text-sm font-semibold ${statusColors[status] || 'bg-gray-100 text-gray-800'}`;
                statusBadge.textContent = statusTexts[status] || status;

                // Services
                if (data.services && data.services.length > 0) {
                    document.getElementById('servicesSection').classList.remove('hidden');
                    const servicesList = document.getElementById('servicesList');
                    servicesList.innerHTML = '';
                    
                    let total = 0;
                    data.services.forEach(service => {
                        const price = parseFloat(service.priceSYP);
                        total += price;
                        
                        servicesList.innerHTML += `
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                <div>
                                    <p class="font-semibold">${service.serviceName}</p>
                                    ${service.serviceDescription ? `<p class="text-sm text-gray-600">${service.serviceDescription}</p>` : ''}
                                    ${service.notes ? `<p class="text-sm text-gray-500 mt-1">ملاحظات: ${service.notes}</p>` : ''}
                                </div>
                                <span class="font-semibold text-blue-600">${price.toLocaleString()} ل.س</span>
                            </div>
                        `;
                    });
                    
                    document.getElementById('totalPrice').textContent = `${total.toLocaleString()} ل.س`;
                }

                // Notes
                if (data.booking.notes) {
                    document.getElementById('notesSection').classList.remove('hidden');
                    document.getElementById('bookingNotes').textContent = data.booking.notes;
                }

                // Completion Date
                if (data.booking.estimatedCompletionDate) {
                    document.getElementById('completionDateSection').classList.remove('hidden');
                    const date = new Date(data.booking.estimatedCompletionDate);
                    document.getElementById('completionDate').textContent = date.toLocaleDateString('ar-EG', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            } else {
                const statusBadge = document.getElementById('statusBadge');
                statusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-gray-100 text-gray-800';
                statusBadge.textContent = 'لا يوجد حجز نشط';
            }
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('carDetails').classList.add('hidden');
            document.getElementById('errorMessage').textContent = message;
        }

        function retryLoad() {
            if (!currentToken) {
                document.getElementById('error').classList.add('hidden');
                document.getElementById('tokenInput').classList.remove('hidden');
            } else {
                document.getElementById('error').classList.add('hidden');
                loadBookingData();
            }
        }

        // Load company settings on page load
        async function loadCompanySettings() {
            try {
                const response = await fetch('http://localhost:8080/api/company/settings');
                if (response.ok) {
                    const settings = await response.json();
                    
                    // Update page title
                    if (settings.companyName) {
                        document.getElementById('pageTitle').textContent = `${settings.companyName} - تتبع السيارة`;
                        document.getElementById('companyName').textContent = settings.companyName;
                    }
                    
                    // Update logo
                    if (settings.companyLogoUrl) {
                        const logoImg = document.getElementById('companyLogo');
                        const defaultLogo = document.getElementById('defaultLogo');
                        
                        logoImg.src = settings.companyLogoUrl;
                        logoImg.onload = () => {
                            logoImg.classList.remove('hidden');
                            defaultLogo.classList.add('hidden');
                        };
                        logoImg.onerror = () => {
                            // Keep default logo on error
                        };
                    }
                }
            } catch (error) {
                console.error('Failed to load company settings:', error);
                // Use default values on error
            }
        }

        // Load company settings immediately
        loadCompanySettings();
    </script>
</body>
</html>
