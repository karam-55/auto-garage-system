version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: garage_postgres
    environment:
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage123
      POSTGRES_DB: garage_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garage_backend
    environment:
      DATABASE_URL: postgresql://garage:garage123@postgres:5432/garage_db
      JWT_SECRET: your-secret-key-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-change-in-production
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: garage_nginx
    ports:
      - "80:80"
    volumes:
      - ./admin_frontend/build/web:/usr/share/nginx/html/admin
      - ./customer-frontend:/usr/share/nginx/html/customer
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
