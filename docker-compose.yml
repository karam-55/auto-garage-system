version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: garage_postgres
    environment:
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage123
      POSTGRES_DB: garage_db
      # Optimize PostgreSQL for 8GB RAM (CX23)
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 512MB
      POSTGRES_MAINTENANCE_WORK_MEM: 256MB
      POSTGRES_WORK_MEM: 256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - garage_network
    # Resource limits for 2 vCPU, 8GB RAM (CX23)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garage_backend
    environment:
      DATABASE_URL: postgresql://garage:garage123@postgres:5432/garage_db?sslmode=disable
      JWT_SECRET: 7f82670b53bd936d32f73af55c021a82
      JWT_REFRESH_SECRET: 673d0b0d0fc538ae34a3d177f682d2ac
      PORT: 8080
      SKIP_SCHEMA_EXECUTION: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - garage_network
    # Resource limits for 2 vCPU, 8GB RAM (CX23)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: garage_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./admin_frontend/build/web:/usr/share/nginx/html/admin
      - ./customer-frontend:/usr/share/nginx/html/customer
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl.conf:/etc/nginx/nginx-ssl.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - garage_network
    # Resource limits for 2 vCPU, 8GB RAM (CX23)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:

networks:
  garage_network:
    driver: bridge
